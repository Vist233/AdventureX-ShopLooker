name = "storevalidator"
compatibility_date = "2026-07-23"
workers_dev = false
main = "storevalidator-worker.mjs"

[[routes]]
pattern = "storevalidator.zhangyvjing.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The public ranking has a stable resource path at `/ranking`; the Worker
# serves its underlying static file without exposing `.html` in shared links.
run_worker_first = ["/api/*", "/ranking", "/ranking/", "/ranking.html"]

[vars]
BACKEND_ORIGIN = "https://shopvalidator.zhangyvjing.com"
