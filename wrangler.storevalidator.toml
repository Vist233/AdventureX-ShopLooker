name = "storevalidator"
compatibility_date = "2026-07-23"
workers_dev = false
main = "storevalidator-worker.mjs"

[[routes]]
pattern = "storevalidator.zhangyvjing.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Static Assets normally canonicalise `/ranking/` back to `/ranking` before
# the presentation Worker sees it.  Route the public ranking through the
# Worker first so the documented trailing-slash URL stays shareable too.
run_worker_first = ["/api/*", "/ranking", "/ranking/"]

[vars]
BACKEND_ORIGIN = "https://shopvalidator.zhangyvjing.com"
