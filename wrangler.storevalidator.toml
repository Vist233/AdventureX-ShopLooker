name = "storevalidator"
compatibility_date = "2026-07-23"
workers_dev = false
main = "storevalidator-worker.mjs"

[[routes]]
pattern = "storevalidator.zhangyvjing.com"
custom_domain = true

[[routes]]
pattern = "demo.storevalidator.zhangyvjing.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
BACKEND_ORIGIN = "https://shopvalidator.zhangyvjing.com"
