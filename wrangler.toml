name = "yongge"
compatibility_date = "2026-07-23"
workers_dev = false
main = "worker.mjs"

# A Custom Domain makes Cloudflare create and manage the DNS record and TLS
# certificate. It avoids exposing a Pages project as the production origin.
[[routes]]
pattern = "yongge.zhangyvjing.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["17 3 * * *"]

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "yongge-analysis"

[[queues.consumers]]
queue = "yongge-analysis"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1
dead_letter_queue = "yongge-analysis-dlq"

[[durable_objects.bindings]]
name = "AGENT_GATE"
class_name = "AgentGate"

[[migrations]]
tag = "v1-agent-gate"
new_sqlite_classes = ["AgentGate"]

[[d1_databases]]
binding = "DB"
database_name = "yongge-cases"
database_id = "2d24b2fd-4119-4932-9458-c2607a09c7c4"

[vars]
APP_ORIGIN = "https://yongge.zhangyvjing.com"
STEPFUN_BASE_URL = "https://api.stepfun.com/step_plan/v1"
STEPFUN_MODEL = "step-3.7-flash"
STEPFUN_TTS_MODEL = "stepaudio-2.5-tts"
STEPFUN_ASR_MODEL = "stepaudio-2.5-asr-stream"
STEPFUN_ASR_URL = "wss://api.stepfun.com/v1/realtime/asr/stream"
ANALYSIS_DAILY_BUDGET = "25"
ANALYSIS_DAILY_IP_BUDGET = "5"

# Secrets are configured with:
#   npx wrangler secret put STEPFUN_API_KEY
# or, for a server-only comma/newline-separated key pool:
#   npx wrangler secret put STEPFUN_API_KEYS
#   npx wrangler secret put TENCENT_MAP_KEY
#
# Production analysis uses ANALYSIS_QUEUE. Each message runs exactly one
# 5-generator + 5-evidence-verifier + 5-execution-verifier round. D1 must be
# bound before deploying the queue consumer, because it stores cumulative
# search state between the four messages.
